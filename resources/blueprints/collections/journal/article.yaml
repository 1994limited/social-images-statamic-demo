title: Article
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          - { handle: title, field: { type: text, required: true, validate: [required] } }
          - { handle: excerpt, field: { type: textarea, display: Excerpt } }
          - { handle: featured_image, field: { type: assets, display: 'Featured image', container: assets, folder: journal, max_files: 1 } }
          - { handle: content, field: { type: markdown, display: Content } }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          - { handle: slug, field: { type: slug, localizable: true, validate: 'max:200' } }
          - { handle: date, field: { type: date, required: true, validate: [required] } }
          - { handle: author, field: { type: users, display: Author, max_items: 1, mode: select } }
      -
        display: Social image
        fields:
          - import: 'social-images::social_image'
