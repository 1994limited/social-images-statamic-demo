<!doctype html>
<html lang="{{ site:short_locale }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{ seo_pro:meta }}
    <style>
        body { margin: 0; font: 18px/1.6 Georgia, serif; color: #1f1a14; background: #f6f1e7; }
        header, main { max-width: 960px; margin: 0 auto; padding: 24px; }
        header a { color: inherit; text-decoration: none; margin-right: 18px; }
        header strong { font-size: 22px; margin-right: 32px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
        .grid img { width: 100%; display: block; border-radius: 4px; }
        .grid a { color: inherit; text-decoration: none; }
        .share { margin-top: 32px; padding: 16px; background: #fff; border-radius: 8px; font: 14px system-ui; }
        .share img { max-width: 100%; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <header>
        <strong><a href="/">Dog-ear Books</a></strong>
        <a href="/books">Books</a>
        <a href="/journal">Journal</a>
    </header>
    <main>{{ template_content }}</main>
</body>
</html>
